version: 2
updates:
  # Minor/patch bumps arrive as one grouped PR a week; majors (TypeScript,
  # Vitest, ESLint, Zod, Next) stay individual so each gets its own review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /services/ninja-proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
